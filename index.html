    <!-- Set the theme before the first paint: the saved choice if there is one, otherwise the system setting. -->
    <script>
      (function () {
        var theme;
        try {
          theme = localStorage.getItem('theme');
        } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        document.documentElement.setAttribute('data-theme', theme);

        // With no #section in the URL, always open at the top instead of restoring the last scroll position.
        if (!location.hash && 'scrollRestoration' in history) history.scrollRestoration = 'manual';
      })();
