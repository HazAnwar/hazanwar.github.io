<!doctype html>
<!-- Source for public/og-image.jpg (the 1200x630 link-preview card). To regenerate after a title change:
     "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --allow-file-access-from-files \

     then save og.png as public/og-image.jpg. --><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}
body{width:1200px;height:630px;overflow:hidden;background:#0a0a0a;font-family:Inter,sans-serif;color:#f2f2f2;position:relative}
.a{position:absolute;border-radius:50%}
.a1{width:900px;height:900px;top:-520px;left:-260px;background:radial-gradient(closest-side,rgba(0,255,225,.32),transparent)}
.a2{width:900px;height:900px;top:-380px;right:-420px;background:radial-gradient(closest-side,rgba(59,130,246,.32),transparent)}
.a3{width:900px;height:900px;bottom:-640px;left:300px;background:radial-gradient(closest-side,rgba(168,85,247,.28),transparent)}
.grid{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.07) 1px,transparent 1px);background-size:24px 24px;-webkit-mask-image:radial-gradient(ellipse 80% 75% at 50% 45%,#000 30%,transparent 85%)}
.wrap{position:absolute;inset:0;display:flex;align-items:center;gap:64px;padding:0 96px}
.ring{width:260px;height:260px;border-radius:50%;padding:6px;background:conic-gradient(from 200deg,#00ffe1,#3b82f6,#a855f7,#00ffe1);box-shadow:0 0 60px rgba(0,255,225,.25);flex-shrink:0}
.ring img{width:100%;height:100%;border-radius:50%;object-fit:cover;border:5px solid #0a0a0a}
h1{font-family:'Space Grotesk';font-weight:700;font-size:76px;line-height:1;color:#00ffe1;text-shadow:0 0 30px rgba(0,255,225,.3)}
h2{font-family:'Space Grotesk';font-weight:600;font-size:36px;margin:18px 0 26px}
.tags{display:flex;flex-wrap:wrap;gap:10px;max-width:700px}
.tags span{font-size:20px;font-weight:500;padding:7px 16px;border-radius:50px;border:1px solid rgba(0,255,225,.35);background:rgba(0,255,225,.08);color:#7ffff0}
.url{position:absolute;right:56px;bottom:40px;font-size:22px;color:#a3a3a3;letter-spacing:.02em}
</style></head><body>
<div class="a a1"></div><div class="a a2"></div><div class="a a3"></div><div class="grid"></div>
<div class="wrap">
 <div class="ring"><img src="../public/assets/avatar.jpg"></div>
 <div><h1>Hazik Anwar</h1><h2>Lead Full Stack Engineer · London</h2>
 <div class="tags"><span>TypeScript</span><span>React</span><span>Node.js</span><span>Kotlin</span><span>Jetpack Compose</span><span>Flutter</span><span>CI/CD</span></div></div>
</div>
<div class="url">hazanwar.github.io</div>
</body></html>
